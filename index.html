<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IGNIS — Evidence-first fire-safety intelligence</title>
    <meta
      name="description"
      content="IGNIS retrieves the closest verified NASA microgravity combustion experiments for a spacecraft fire scenario, explains what they observed, and marks where the current catalog has no matching evidence."
    />
    <meta name="author" content="Team AstroFlare" />
    <meta name="theme-color" content="#0C0F16" />
    <link rel="canonical" href="https://ignisprototype01.vercel.app/" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons (generated from /art/logo-flame.webp) -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ignisprototype01.vercel.app/" />
    <meta property="og:site_name" content="IGNIS" />
    <meta property="og:title" content="IGNIS — Evidence-first fire-safety intelligence for human spaceflight" />
    <meta
      property="og:description"
      content="What NASA saw — nothing it didn't. Verified microgravity burn tests, source-checked claims, and catalog gaps made visible."
    />
    <meta property="og:image" content="https://ignisprototype01.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IGNIS — Evidence-first fire-safety intelligence for human spaceflight" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IGNIS — Evidence-first fire-safety intelligence for human spaceflight" />
    <meta name="twitter:image" content="https://ignisprototype01.vercel.app/og-image.png" />

    <!-- LCP: the hero. Same srcset/sizes as the <img>, so the browser preloads exactly the file it will use. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/art/hero-ops-room-sm.webp 960w, /art/hero-ops-room.webp 1672w"
      imagesizes="(min-width: 1280px) 100vw, 92vw"
      fetchpriority="high"
    />

    <!-- Fonts: self-hosted Space Grotesk (UI) + IBM Plex Mono (console). Preload the one above the fold. -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
